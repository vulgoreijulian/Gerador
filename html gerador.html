<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate XI - Montador Tático de Elenco</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pitch: {
                            light: '#2e7d32',
                            dark: '#1b4332',
                        },
                        gold: {
                            400: '#facc15',
                            500: '#eab308',
                            600: '#ca8a04',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090d16;
            color: #f8fafc;
            user-select: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #10b981;
        }

        /* Pitch Styles */
        .pitch-container {
            position: relative;
            background: radial-gradient(circle at center, #1b4332 0%, #0d281e 100%);
            border-radius: 1.25rem;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .pitch-pattern {
            background-image: repeating-linear-gradient(
                0deg,
                rgba(255, 255, 255, 0.03),
                rgba(255, 255, 255, 0.03) 35px,
                rgba(0, 0, 0, 0.06) 35px,
                rgba(0, 0, 0, 0.06) 70px
            );
        }

        /* 3D Pitch Perspective Effect */
        .pitch-3d {
            perspective: 1100px;
        }
        
        .pitch-3d .pitch-inner {
            transform: rotateX(28deg) scale(0.92);
            transform-style: preserve-3d;
            box-shadow: 0 35px 60px rgba(0, 0, 0, 0.85);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .pitch-2d .pitch-inner {
            transform: rotateX(0deg) scale(1);
            transition: transform 0.6s ease;
        }

        /* Player Card Component Hover */
        .player-slot {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), z-index 0.2s;
        }

        .player-slot:hover {
            transform: scale(1.1) translateY(-6px) translate(-50%, -50%) !important;
            z-index: 40 !important;
        }

        /* Gold Card Glow */
        .card-gold {
            background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #854d0e 100%);
            border: 1.5 border;
            border-color: #fef08a;
            box-shadow: 0 4px 20px rgba(234, 179, 8, 0.35);
        }

        /* Modal Overlay Fade */
        .modal-backdrop {
            background-color: rgba(3, 7, 18, 0.82);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100 overflow-x-hidden">

    <header class="bg-slate-900/90 border-b border-slate-800/80 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-emerald-500 to-teal-400 p-2.5 rounded-xl shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-shield-halved text-slate-950 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-emerald-400 bg-clip-text text-transparent">
                        ULTIMATE XI <span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-mono uppercase">Tática 80+</span>
                    </h1>
                    <p class="text-xs text-slate-400 hidden sm:block">Monte e gerencie seu time dos sonhos com craques mundiais</p>
                </div>
            </div>

            <!-- Top Control Action Buttons -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <button onclick="generateRandomSquad()" class="px-3.5 py-2 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold text-xs sm:text-sm flex items-center gap-2 shadow-lg shadow-emerald-900/30 transition-all hover:scale-105 active:scale-95">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-300"></i>
                    <span>Escalar Aleatório</span>
                </button>
                <button onclick="clearSquad()" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-medium text-xs sm:text-sm border border-slate-700/80 flex items-center gap-1.5 transition-all">
                    <i class="fa-solid fa-trash-can text-red-400"></i>
                    <span class="hidden sm:inline">Limpar</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- PITCH AREA (7 cols) -->
        <section class="lg:col-span-7 flex flex-col space-y-4">

                <div class="flex items-center space-x-2">
                    <label for="formation-select" class="text-xs font-semibold uppercase text-slate-400 flex items-center gap-1.5">
                        <i class="fa-solid fa-diagram-project text-emerald-400"></i>
                        <span>Tática:</span>
                    </label>
                    <select id="formation-select" onchange="changeFormation(this.value)" class="bg-slate-950 border border-slate-700 text-white rounded-xl text-xs sm:text-sm font-bold px-3 py-1.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none cursor-pointer">
                        <option value="4-3-3">4-3-3 Clássico</option>
                        <option value="4-4-2">4-4-2 Tradicional</option>
                        <option value="3-5-2">3-5-2 Ofensivo</option>
                        <option value="4-2-3-1">4-2-3-1 Moderno</option>
                        <option value="3-4-3">3-4-3 Total</option>
                        <option value="4-1-4-1">4-1-4-1 Equilibrado</option>
                        <option value="4-5-1">4-5-1 Defensivo</option>
                        <option value="5-3-2">5-3-2 Contra-Ataque</option>
                        <option value="3-4-1-2">3-4-1-2 Criativo</option>
                        <option value="4-3-1-2">4-3-1-2 Losango</option>
                    </select>
                </div>

                <!-- 2D / 3D Pitch View Toggle -->
                <div class="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800">
                    <button id="view-2d-btn" onclick="togglePitchView('2d')" class="px-3 py-1 rounded-lg text-xs font-bold transition-all bg-emerald-500 text-slate-950 shadow-md">
                        <i class="fa-solid fa-map"></i> 2D Tático
                    </button>
                    <button id="view-3d-btn" onclick="togglePitchView('3d')" class="px-3 py-1 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition-all">
                        <i class="fa-solid fa-cube"></i> 3D Relvado
                    </button>
                </div>

                <!-- Squad OVR Stats Badge -->
                <div class="flex items-center gap-3 bg-slate-950/80 px-3 py-1 rounded-xl border border-slate-800">
                    <div class="text-center">
                        <span class="block text-[9px] text-slate-400 uppercase font-semibold">Média OVR</span>
                        <span id="avg-ovr-display" class="text-xs sm:text-sm font-extrabold text-amber-400">0</span>
                    </div>
                    <div class="h-5 w-px bg-slate-800"></div>
                    <div class="text-center">
                        <span class="block text-[9px] text-slate-400 uppercase font-semibold">Titulares</span>
                        <span id="squad-count-display" class="text-xs sm:text-sm font-bold text-emerald-400">0/11</span>
                    </div>
                </div>
            </div>

            <!-- Pitch Canvas Area -->
            <div id="pitch-wrapper" class="pitch-container pitch-2d w-full aspect-[3/4] sm:aspect-[4/5] md:aspect-[3/4] flex flex-col justify-between p-4 sm:p-6 border border-emerald-900/30">
                <div class="pitch-inner w-full h-full relative flex flex-col justify-between">
                    
                    <!-- Pitch Markings Layer -->
                    <div class="absolute inset-0 pitch-pattern pointer-events-none rounded-xl opacity-90"></div>
                    <div class="absolute inset-0 border-2 border-white/20 rounded-xl pointer-events-none"></div>
                    <div class="absolute top-1/2 left-0 right-0 h-0.5 bg-white/20 pointer-events-none -translate-y-1/2"></div>
                    <div class="absolute top-1/2 left-1/2 w-28 h-28 sm:w-36 sm:h-36 border-2 border-white/20 rounded-full pointer-events-none -translate-x-1/2 -translate-y-1/2 flex items-center justify-center">
                        <div class="w-2 h-2 bg-white/30 rounded-full"></div>
                    </div>
                    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-1/2 h-1/6 border-b-2 border-x-2 border-white/20 pointer-events-none"></div>
                    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1/2 h-1/6 border-t-2 border-x-2 border-white/20 pointer-events-none"></div>

                    <!-- Dynamic Player Slots Container -->
                    <div id="formation-field" class="absolute inset-0 w-full h-full">
                        <!-- Rendered by JS -->
                    </div>
                </div>
            </div>
        </section>

        <!-- COMPACT & COLLAPSIBLE SIDEBAR: DATABASE (5 cols) -->

                <!-- Minimize / Expand Toggle -->

                </div>

                    <!-- Dynamic Cards Rendered Here -->
                </div>
            </div>
        </section>
    </main>

            <!-- Modal Header -->
            <div class="p-4 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
                <div>
                    <span class="text-[10px] text-emerald-400 font-mono uppercase tracking-wider block">Substituição Direta</span>
                    <h3 class="text-base font-extrabold text-white flex items-center gap-2">
                        <span>Escolher Jogador para a Posição</span>
                        <span id="modal-pos-badge" class="bg-amber-500 text-slate-950 text-xs px-2 py-0.5 rounded font-black uppercase">GOL</span>

                </div>
                <button onclick="closeSwapModal()" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition-all">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Modal Search Input -->
            <div class="p-3 bg-slate-900/90 border-b border-slate-800">
                <input type="text" id="modal-search" oninput="renderModalPlayers()" placeholder="Filtrar nesta posição por nome, país, liga..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <!-- Modal Scrollable Player List -->
            <div id="modal-player-list" class="max-h-80 overflow-y-auto p-3 space-y-2">
                <!-- Injected via JS -->
            </div>

            <!-- Modal Footer -->
            <div class="p-3 bg-slate-950 border-t border-slate-800 flex justify-between items-center text-xs">
                <button id="modal-remove-btn" onclick="removePlayerFromCurrentSlot()" class="text-red-400 hover:text-red-300 font-semibold flex items-center gap-1">
                    <i class="fa-solid fa-user-minus"></i> Desescalar Posição
                </button>
                <button onclick="closeSwapModal()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium">
                    Cancelar
                </button>
            </div>
        </div>
    </div>

                        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-amber-600 to-yellow-400 text-slate-950 font-black text-xs flex flex-col items-center justify-center leading-none shadow">
                            <span>${player.ovr}</span>
                            <span class="text-[7px] uppercase tracking-tighter">${player.pos}</span>
                        </div>
                        <div>
                            <div class="flex items-center gap-1">
                                <span class="font-bold text-xs text-white">${player.name}</span>
                                <span class="text-[10px]">${player.flag}</span>
                            </div>
                            <div class="text-[10px] text-slate-400">
                                <span class="text-emerald-400 font-medium">${player.league}</span> • ${player.club}
                            </div>
                        </div>
                    </div>
                    <div>
                        ${isSelected ? 
                            `<span class="text-[9px] uppercase font-bold text-slate-500 bg-slate-900 px-1.5 py-0.5 rounded border border-slate-800">No Time</span>` : 
                            `<button class="px-2 py-1 rounded bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 text-[10px] font-bold border border-emerald-500/20">
                                + Add
                             </button>`
                        }
                    </div>
                `;

                playerListContainer.appendChild(cardDiv);
            });
        }

        function openSwapModalForIndex(index) {
            activeSlotIndex = index;
            const slotPos = FORMATIONS[currentFormation][index].pos;
            modalPosBadge.innerText = slotPos;

            document.getElementById("modal-search").value = "";
            swapModal.classList.remove("hidden");
            renderModalPlayers();
        }

        function closeSwapModal() {
            swapModal.classList.add("hidden");
            activeSlotIndex = null;
        }

        function renderModalPlayers() {
            const query = document.getElementById("modal-search").value.toLowerCase();
            const slotPos = FORMATIONS[currentFormation][activeSlotIndex].pos;
            const targetCat = getCatFromPos(slotPos);

            // Prioritize players matching exact position or category first
            const eligible = PLAYERS_DATABASE.filter(p => {
                const matchesQuery = p.name.toLowerCase().includes(query) ||
                                     p.club.toLowerCase().includes(query) ||
                                     p.league.toLowerCase().includes(query) ||
                                     p.country.toLowerCase().includes(query);
                return matchesQuery;
            }).sort((a, b) => {
                // Positional affinity priority
                const aExact = (a.pos === slotPos) ? 2 : (a.cat === targetCat ? 1 : 0);
                const bExact = (b.pos === slotPos) ? 2 : (b.cat === targetCat ? 1 : 0);
                if (bExact !== aExact) return bExact - aExact;
                return b.ovr - a.ovr;
            });

            modalPlayerList.innerHTML = "";

            eligible.forEach(player => {
                const isSelected = squad.some(s => s && s.id === player.id);
                const isCurrentInSlot = squad[activeSlotIndex] && squad[activeSlotIndex].id === player.id;

                const item = document.createElement("div");
                item.className = `p-2.5 rounded-xl border flex items-center justify-between transition-all ${isCurrentInSlot ? 'bg-emerald-950/40 border-emerald-500/50' : (isSelected ? 'bg-slate-950/40 border-slate-800 opacity-50' : 'bg-slate-950 hover:bg-slate-800 border-slate-800 cursor-pointer')}`;

                if (!isSelected) {
                    item.onclick = () => {
                        squad[activeSlotIndex] = player;
                        closeSwapModal();
                        renderPitchSlots();
                        filterPlayers();
                    };
                }

                item.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-amber-600 to-yellow-400 text-slate-950 font-black text-xs flex flex-col items-center justify-center leading-none">
                            <span>${player.ovr}</span>
                            <span class="text-[7px] uppercase font-extrabold">${player.pos}</span>
                        </div>
                        <div>
                            <div class="flex items-center gap-1.5">
                                <span class="font-bold text-xs text-white">${player.name}</span>
                                <span>${player.flag}</span>
                            </div>
                            <div class="text-[10px] text-slate-400">
                                <span class="text-emerald-400 font-medium">${player.league}</span> • ${player.club}
                            </div>
                        </div>
                    </div>
                    <div>
                        ${isCurrentInSlot ? 
                            `<span class="text-[9px] uppercase font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">Titular</span>` :
                            (isSelected ? 
                                `<span class="text-[9px] uppercase font-bold text-slate-500 bg-slate-900 px-2 py-0.5 rounded border border-slate-800">Em Outra Posição</span>` :
                                `<button class="px-2.5 py-1 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs shadow">
                                    Substituir
                                 </button>`
                            )
                        }
                    </div>
                `;

                modalPlayerList.appendChild(item);
            });
        }

        function removePlayerFromCurrentSlot() {
            if (activeSlotIndex !== null) {
                squad[activeSlotIndex] = null;
                closeSwapModal();
                renderPitchSlots();
                filterPlayers();
            }
        }

        // Assign to first empty slot
        function assignPlayerToFirstEmptyOrSlot(player) {
            const emptyIndex = squad.findIndex(s => s === null);
            if (emptyIndex !== -1) {
                squad[emptyIndex] = player;
                renderPitchSlots();
                filterPlayers();
            } else {
                alert("O time já possui 11 titulares. Clique em um jogador no campo para substituí-lo.");
            }
        }

        function generateRandomSquad() {
            clearSquad();
            const formationPositions = FORMATIONS[currentFormation];

            formationPositions.forEach((slot, index) => {
                let candidateList = PLAYERS_DATABASE.filter(p => p.cat === getCatFromPos(slot.pos) && !squad.includes(p));
                if (candidateList.length === 0) {
                    candidateList = PLAYERS_DATABASE.filter(p => !squad.includes(p));
                }

                if (candidateList.length > 0) {
                    const randomIndex = Math.floor(Math.random() * candidateList.length);
                    squad[index] = candidateList[randomIndex];
                }
            });

            renderPitchSlots();
            filterPlayers();
        }

        function getCatFromPos(pos) {
            if (pos === "GOL") return "GK";
            if (["ZAG", "LD", "LE"].includes(pos)) return "DEF";
            if (["VOL", "MC", "MEI"].includes(pos)) return "MID";
            return "FWD";
        }

        function clearSquad() {
            squad = new Array(11).fill(null);
            renderPitchSlots();
            filterPlayers();
        }

        function changeFormation(newFormation) {
            currentFormation = newFormation;
            renderPitchSlots();
        }

        function setActiveTab(category) {
            currentCategoryTab = category;
            document.querySelectorAll(".tab-btn").forEach(btn => {
                btn.className = "tab-btn px-2.5 py-1.5 rounded-t-lg text-slate-400 hover:text-slate-200 hover:bg-slate-900 whitespace-nowrap text-[11px] transition-all";
            });

            const activeBtn = document.getElementById(`tab-${category}`);
            if (activeBtn) {
                activeBtn.className = "tab-btn px-2.5 py-1.5 rounded-t-lg bg-slate-800 text-emerald-400 border-t-2 border-emerald-500 whitespace-nowrap text-[11px] transition-all font-bold";
            }

            filterPlayers();
        }

        // Toggle Sidebar Minimize / Expand
        function toggleSidebarMinimize() {
            const content = document.getElementById("sidebar-content");
            const icon = document.getElementById("minimize-icon");
            const text = document.getElementById("minimize-text");

            isSidebarMinimized = !isSidebarMinimized;

            if (isSidebarMinimized) {
                content.classList.add("hidden");
                icon.className = "fa-solid fa-chevron-down text-xs";
                text.innerText = "Expandir";
            } else {
                content.classList.remove("hidden");
                icon.className = "fa-solid fa-chevron-up text-xs";
                text.innerText = "Minimizar";
            }
        }

        // Toggle 2D / 3D Pitch View Mode
        function togglePitchView(mode) {
            const btn2d = document.getElementById("view-2d-btn");
            const btn3d = document.getElementById("view-3d-btn");

            if (mode === '3d') {
                pitchWrapper.classList.remove("pitch-2d");
                pitchWrapper.classList.add("pitch-3d");
                btn3d.className = "px-3 py-1 rounded-lg text-xs font-bold transition-all bg-emerald-500 text-slate-950 shadow-md";
                btn2d.className = "px-3 py-1 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition-all";
            } else {
                pitchWrapper.classList.remove("pitch-3d");
                pitchWrapper.classList.add("pitch-2d");
                btn2d.className = "px-3 py-1 rounded-lg text-xs font-bold transition-all bg-emerald-500 text-slate-950 shadow-md";
                btn3d.className = "px-3 py-1 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition-all";
            }
        }

        function updateSquadStats() {
            const filledCount = squad.filter(s => s !== null).length;
            squadCountDisplay.innerText = `${filledCount}/11`;

            if (filledCount === 0) {
                avgOvrDisplay.innerText = "0";
                return;
            }

            const totalOvr = squad.reduce((sum, p) => sum + (p ? p.ovr : 0), 0);
            avgOvrDisplay.innerText = Math.round(totalOvr / filledCount);
        }
    </script>
</body>
</html>
